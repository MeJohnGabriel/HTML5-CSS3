<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Centralização absoluta</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background-color: lightsalmon;
      }

      main {
        background-color: lightgreen;
        height: 100vh;
        width: 100vw;

        display: flex;
        flex-flow: row nowrap;
        justify-content: center;
        align-items: center;
      }

      section {
        background-color: lightseagreen;
        width: 200px;
        height: 200px;
        border-radius: 12px;
        text-align: center;
        display: flex;
        align-items: center;
        color: aliceblue;
        justify-content: center;
      }
    </style>
  </head>
  <body>
    <main>
      <section>
        <h1>BLOCO A</h1>
      </section>
    </main>
  </body>
</html>
