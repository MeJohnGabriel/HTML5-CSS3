<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>form005</title>
  </head>
  <body>
    <form action="form.js" method="get"></form>
    <fieldset>
      <legend>Gender</legend>
      <input type="radio" name="gender" id="imas" checked value="M" /><label
        for="imas"
        >Male</label
      >
      <br />
      <input type="radio" name="gender" id="ifem" value="F" /><label for="ifem"
        >Female</label
      >
    </fieldset>
    <fieldset>
      <legend>Sports</legend>
      <input type="checkbox" name="soccer" id="isoccer" /><label for="isoccer"
        >Soccer</label
      >
      <br />
      <input type="checkbox" name="football" id="ifootball" /><label
        for="ifootball"
        >Football </label
      ><br />
      <input type="checkbox" name="soccer" id="itennis" /><label for="itennis"
        >Tennis</label
      >
      <br />
    </fieldset>
    <p>
      <input type="submit" value="Send" />
      <input type="reset" value="Reset" />
    </p>
  </body>
</html>
